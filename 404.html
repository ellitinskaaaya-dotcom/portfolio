<!-- Страница 404 (2026-11-13), по примеру Елены: 404 у Boc Studio (Awwwards SOTD, пост Instagram DfnF0ZMCNEE, 4-й кадр).
     Оттуда: весь экран одним цветом, огромное «404» тоном темнее, цифры плывут; через середину бежит строка со ссылкой домой; подпись в углу.
     Наше: цифры — узкая антиква (у нас она только для цифр), вместо кружка в строке — её вихрь, цвета — из :root сайта. ?t=dark — тёмный вариант.
     Собирается из maket/src/404-shablon.html скриптом build_maket.py (вставляет знак-вихрь). -->
<style>
:root{--bg:#f3f1ed;--ink:#161616;--mid:#717171;--dig:#dcd7ce;--fd:"Noto Serif Display",serif;--fb:"Inter Tight",system-ui,sans-serif;--m:24px;--dw:100}
:root.dark{--bg:#1c1b19;--ink:#f3f1ed;--mid:#8f8c86;--dig:#2f2d2a}
@media (max-width:700px){:root{--m:16px}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.35 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dg{position:fixed;inset:0;width:100%;height:100%;display:block}
/* ширина цифр: 62.5 — самые узкие, 100 — самые широкие (Елена, 2026-11-13: «пошире») */
.dg text{font-family:var(--fd);font-variation-settings:"wdth" var(--dw);font-stretch:calc(var(--dw) * 1%);font-weight:300;fill:var(--dig);letter-spacing:-.02em}
/* бегущая строка через середину */
.tk{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);overflow:hidden;white-space:nowrap;font-size:clamp(15px,1.25vw,18px)}
.tk-in{display:inline-flex;animation:tk 38s linear infinite}
.tk:hover .tk-in{animation-play-state:paused}
.tk-g{display:inline-flex;align-items:center;gap:.9em;padding-right:.9em}
.tk-g span{color:var(--mid)}
.tk-g a{display:inline-flex;align-items:center;gap:.5em;border-bottom:1px solid currentColor;padding-bottom:1px}
.tk-g a:hover{color:var(--mid)}
.tk svg{width:1.25em;height:1.17em;flex:none}
@keyframes tk{to{transform:translateX(-50%)}}
.nm{position:fixed;left:var(--m);bottom:var(--m);font-size:13px;line-height:1.35}
.nm b{display:block;font-weight:600}.nm span{color:var(--mid)}
/* куда написать (Елена, 2026-11-13) — в правом нижнем углу, напротив имени */
.ct{position:fixed;right:var(--m);bottom:var(--m);font-size:13px;line-height:1.35;text-align:right}
.ct span{display:block;color:var(--mid)}
.ct a{border-bottom:1px solid currentColor}.ct a:hover{color:var(--mid)}
@media (max-width:520px){.nm span{display:none}}
@media (prefers-reduced-motion:reduce){.tk-in{animation:none}}
</style>
